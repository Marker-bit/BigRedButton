[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bigredbutton"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "camoufox>=0.5.4",
    "psutil>=7.2.2",
    "pytest-playwright>=0.8.0",
    "requests>=2.34.2",
]

[tool.setuptools]
py-modules = ["main", "adb", "config", "processes", "rutube_api", "rutube_media", "series"]
