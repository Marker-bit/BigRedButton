[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bigredbutton"
version = "0.1.8"
description = "Open selected RUTUBE episodes on an Android TV over Ethernet"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "androidtvremote2>=0.3.1",
    "psutil>=7.2.2",
    "requests>=2.34.2",
]

[tool.setuptools]
py-modules = ["main", "adb", "config", "processes", "rutube_api", "rutube_media", "series", "remote", "iphelp"]
